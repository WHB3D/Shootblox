name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  ROJO_VERSION: 7.7.1
  WALLY_VERSION: 0.3.2
  SELENE_VERSION: 0.29.1
  STYLUA_VERSION: 2.3.1
  LUau_LSP_VERSION: 1.53.0

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup rokit
        uses: rokit/rokit/setup-rokit@v1
        with:
          versions: |
            rojo@${{ env.ROJO_VERSION }}
            wally@${{ env.WALLY_VERSION }}
            selene@${{ env.SELENE_VERSION }}
            stylua@${{ env.STYLUA_VERSION }}
            luau-lsp@${{ env.LUau_LSP_VERSION }}

      - name: Install Wally dependencies
        run: wally install

      - name: Selene lint
        run: selene src/

      - name: StyLua check
        run: stylua --check src/

      - name: Generate Rojo sourcemap
        run: rojo sourcemap -o sourcemap.json

      - name: luau-lsp analyze
        run: luau-lsp analyze --sourcemap sourcemap.json --definitions types/globalTypes.d.lua src/

  build:
    name: Build Place
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup rokit
        uses: rokit/rokit/setup-rokit@v1
        with:
          versions: |
            rojo@${{ env.ROJO_VERSION }}
            wally@${{ env.WALLY_VERSION }}

      - name: Install Wally dependencies
        run: wally install

      - name: Build place
        run: rojo build -o shootblox.rbxl

      - name: Upload place artifact
        uses: actions/upload-artifact@v4
        with:
          name: shootblox-place
          path: shootblox.rbxl

  test:
    name: Unit Tests (Studio)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup rokit
        uses: rokit/rokit/setup-rokit@v1
        with:
          versions: |
            rojo@${{ env.ROJO_VERSION }}
            wally@${{ env.WALLY_VERSION }}

      - name: Install Wally dependencies
        run: wally install

      - name: Build test place
        run: rojo build -o shootblox-test.rbxl --project tests.project.json

      - name: Upload test place
        uses: actions/upload-artifact@v4
        with:
          name: shootblox-test-place
          path: shootblox-test.rbxl

      - name: Test note
        run: |
          echo "::notice::Unit tests run in Roblox Studio via TestEZ."
          echo "Open shootblox-test.rbxl in Studio, run TestEZ.TestBootstrap:run() from tests/run.luau"
          echo "See tests/CombatService/*.spec.luau for 9 validation check tests"

  publish-staging:
    name: Publish Staging
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download place artifact
        uses: actions/download-artifact@v4
        with:
          name: shootblox-place
          path: .

      - name: Setup rbxcloud
        uses: rokit/rokit/setup-rokit@v1
        with:
          versions: |
            rbxcloud@0.17.0

      - name: Publish to staging
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_STAGING_PLACE_ID }}
        run: |
          rbxcloud experience publish -f shootblox.rbxl \
            -u $ROBLOX_UNIVERSE_ID \
            -p $ROBLOX_PLACE_ID \
            -t published

      - name: Tag release
        run: |
          VERSION=$(date +v0.%Y%m%d.%H%M)
          git tag $VERSION
          git push origin $VERSION

  publish-production:
    name: Publish Production
    runs-on: ubuntu-latest
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download place artifact
        uses: actions/download-artifact@v4
        with:
          name: shootblox-place
          path: .

      - name: Setup rbxcloud
        uses: rokit/rokit/setup-rokit@v1
        with:
          versions: |
            rbxcloud@0.17.0

      - name: Publish to production
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PRODUCTION_PLACE_ID }}
        run: |
          rbxcloud experience publish -f shootblox.rbxl \
            -u $ROBLOX_UNIVERSE_ID \
            -p $ROBLOX_PLACE_ID \
            -t published