name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rokit + tools
        run: |
          curl -sL https://github.com/rojo-rbx/rokit/releases/latest/download/rokit-1.2.0-linux-x86_64.zip -o rokit.zip
          unzip -o rokit.zip
          chmod +x rokit
          echo "$HOME/.rokit/bin" >> $GITHUB_PATH
          ./rokit trust rojo-rbx/rojo UpliftGames/wally kampfkarren/selene JohnnyMorganz/stylua JohnnyMorganz/luau-lsp lune-org/lune Sleitnick/rbxcloud
          ./rokit install

      - name: Install Wally packages
        run: ~/.rokit/bin/wally install

      - name: Selene lint
        run: ~/.rokit/bin/selene --allow-warnings src/

      - name: StyLua check
        run: ~/.rokit/bin/stylua --check src/ tests/

      - name: Generate Rojo sourcemap
        run: ~/.rokit/bin/rojo sourcemap -o sourcemap.json

      - name: luau-lsp analyze
        run: ~/.rokit/bin/luau-lsp analyze --sourcemap sourcemap.json --definitions types/globalTypes.d.lua --ignore 'Packages/**' --ignore 'DevPackages/**' --ignore 'src/shared/Vendor/**' src/

  build:
    name: Build Place
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rokit + tools
        run: |
          curl -sL https://github.com/rojo-rbx/rokit/releases/latest/download/rokit-1.2.0-linux-x86_64.zip -o rokit.zip
          unzip -o rokit.zip
          chmod +x rokit
          echo "$HOME/.rokit/bin" >> $GITHUB_PATH
          ./rokit trust rojo-rbx/rojo UpliftGames/wally kampfkarren/selene JohnnyMorganz/stylua JohnnyMorganz/luau-lsp lune-org/lune Sleitnick/rbxcloud
          ./rokit install

      - name: Install Wally packages
        run: ~/.rokit/bin/wally install

      - name: Build place
        run: ~/.rokit/bin/rojo build -o shootblox.rbxl

      - name: Upload place artifact
        uses: actions/upload-artifact@v4
        with:
          name: shootblox-place
          path: shootblox.rbxl

  test:
    name: Unit Tests (Studio)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rokit + tools
        run: |
          curl -sL https://github.com/rojo-rbx/rokit/releases/latest/download/rokit-1.2.0-linux-x86_64.zip -o rokit.zip
          unzip -o rokit.zip
          chmod +x rokit
          echo "$HOME/.rokit/bin" >> $GITHUB_PATH
          ./rokit trust rojo-rbx/rojo UpliftGames/wally kampfkarren/selene JohnnyMorganz/stylua JohnnyMorganz/luau-lsp lune-org/lune Sleitnick/rbxcloud
          ./rokit install

      - name: Install Wally packages
        run: ~/.rokit/bin/wally install

      - name: Build test place
        run: ~/.rokit/bin/rojo build -o shootblox-test.rbxl --project tests.project.json

      - name: Upload test place
        uses: actions/upload-artifact@v4
        with:
          name: shootblox-test-place
          path: shootblox-test.rbxl

      - name: Test note
        run: |
          echo "::notice::Unit tests run in Roblox Studio via TestEZ."
          echo "Open shootblox-test.rbxl in Studio, run TestEZ.TestBootstrap:run() from tests/run.luau"

  publish-staging:
    name: Publish Staging
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download place artifact
        uses: actions/download-artifact@v4
        with:
          name: shootblox-place
          path: .

      - name: Install rokit + tools
        run: |
          curl -sL https://github.com/rojo-rbx/rokit/releases/latest/download/rokit-1.2.0-linux-x86_64.zip -o rokit.zip
          unzip -o rokit.zip
          chmod +x rokit
          echo "$HOME/.rokit/bin" >> $GITHUB_PATH
          ./rokit trust rojo-rbx/rojo UpliftGames/wally kampfkarren/selene JohnnyMorganz/stylua JohnnyMorganz/luau-lsp lune-org/lune Sleitnick/rbxcloud
          ./rokit install

      - name: Publish to staging
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_STAGING_PLACE_ID }}
        run: |
          ~/.rokit/bin/rbxcloud experience publish -f shootblox.rbxl \
            -u $ROBLOX_UNIVERSE_ID \
            -p $ROBLOX_PLACE_ID \
            -t published

      - name: Tag release
        run: |
          VERSION=$(date +v0.%Y%m%d.%H%M)
          git tag $VERSION
          git push origin $VERSION

  publish-production:
    name: Publish Production
    runs-on: ubuntu-latest
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download place artifact
        uses: actions/download-artifact@v4
        with:
          name: shootblox-place
          path: .

      - name: Install rokit + tools
        run: |
          curl -sL https://github.com/rojo-rbx/rokit/releases/latest/download/rokit-1.2.0-linux-x86_64.zip -o rokit.zip
          unzip -o rokit.zip
          chmod +x rokit
          echo "$HOME/.rokit/bin" >> $GITHUB_PATH
          ./rokit trust rojo-rbx/rojo UpliftGames/wally kampfkarren/selene JohnnyMorganz/stylua JohnnyMorganz/luau-lsp lune-org/lune Sleitnick/rbxcloud
          ./rokit install

      - name: Publish to production
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PRODUCTION_PLACE_ID }}
        run: |
          ~/.rokit/bin/rbxcloud experience publish -f shootblox.rbxl \
            -u $ROBLOX_UNIVERSE_ID \
            -p $ROBLOX_PLACE_ID \
            -t published